name: Build and Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "20"

            - name: Build
              run: node build.mjs

            - name: Setup SSH
              env:
                  SSH_KEY: ${{ secrets.DOJO_SSH_KEY }}
                  KNOWN_HOST: ${{ secrets.DOJO_KNOWN_HOST }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts

            - name: Deploy to Raspberry Pi
              run: ssh -p 2222 -o StrictHostKeyChecking=yes dojo-deploy@harruis.fr < dist/index.html

            - name: Check site
              run: curl -fsSI https://dreamland.harruis.fr/