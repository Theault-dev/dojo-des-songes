# Jeu en ligne : routes servies par le serveur Node (127.0.0.1:8787).
# À inclure dans le bloc « server { listen 443 ssl; server_name dreamland.harruis.fr; … } » :
#     include snippets/dojo-pvp.conf;
# Le reste du site (page du jeu, /conditions, /confidentialite) reste servi en fichiers statiques.

# WebSocket des parties
location = /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Adresse du joueur (remplace toute valeur envoyée par le client : pas d'usurpation)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# Connexion Discord, sessions, compte, contact
location ^~ /auth/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}
location = /compte {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ^~ /compte/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}
location = /contact {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 16k;
}
