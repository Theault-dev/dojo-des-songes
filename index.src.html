<title>Dojo des Songes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Martian+Mono:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout : plateau en colonne (adversaire · combat · vous · décision · main) + rail latéral (inspecteur, journal).
   Univers volontairement nocturne : l'Arène se joue de nuit, l'ambre de l'Aurore sert d'accent. */
:root {
  color-scheme: dark;
  --ink: #11132a;        /* nuit */
  --panel: #191c3a;
  --panel-2: #222650;
  --line: #333a6e;
  --fg: #ece9f7;
  --muted: #a6a3c8;
  --dawn: #ffb44c;       /* Aurore : accent unique */
  --dawn-ink: #2a1a00;
  --good: #6fdc9a;
  --bad: #ff7b7b;
  --feu: #ff6a45;
  --glace: #5ec9ff;
  --killer: #c08bff;
  --titan: #e6be4f;
  --base: #9ea3c6;
  --f-display: 'Dela Gothic One', 'Arial Black', Impact, sans-serif;
  --f-body: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
  --card-w: 92px;
  --card-h: 128px;
}
body {
  background: radial-gradient(1200px 600px at 70% -10%, #23275a 0%, transparent 60%), var(--ink);
  background-color: var(--ink);
  color: var(--fg);
  font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
.eyebrow { font: 700 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dawn); margin: 0; }

/* ── Boutons ───────────────────────────────────── */
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 700; transition: transform .12s, background .12s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--dawn); color: var(--dawn-ink); border-color: var(--dawn); }
.btn.primary:hover:not(:disabled) { background: #ffc66f; }
.btn.action { border-color: var(--dawn); color: var(--dawn); background: transparent; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.big { padding: 12px 26px; font-size: 16px; }
.btn.small { padding: 4px 10px; font-size: 12px; }

/* ── Écran de choix ────────────────────────────── */
.setup { max-width: 1040px; margin: 0 auto; padding-block: 48px 24px; display: grid; gap: 32px; }
.setup-head { display: grid; gap: 12px; }
.setup h1 { font: 400 clamp(40px, 7vw, 76px)/1 var(--f-display); letter-spacing: .01em; }
.lede { color: var(--muted); max-width: 60ch; margin: 0; font-size: 17px; }
.pick { display: grid; gap: 12px; }
.pick h2 { font: 700 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.deck { text-align: left; display: grid; gap: 6px; padding: 16px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); cursor: pointer; position: relative; overflow: hidden; }
.deck::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--fam); }
.deck.on { border-color: var(--fam); background: color-mix(in srgb, var(--fam) 14%, var(--panel)); }
.deck-name { font: 400 26px/1 var(--f-display); color: var(--fam); }
.deck-lieu { font: 500 11px/1.2 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.deck-pitch { font-size: 14px; }
.deck-meta { font-size: 12px; color: var(--muted); }
.setup-foot { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.speed { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.speed select { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; }

.fam-feu { --fam: var(--feu); } .fam-glace { --fam: var(--glace); } .fam-killer { --fam: var(--killer); }
.fam-titan { --fam: var(--titan); } .fam-base { --fam: var(--base); }

/* ── Jeu ──────────────────────────────────────── */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto 1fr; gap: 12px 16px; max-width: 1500px; margin: 0 auto; }
.topbar { grid-column: 1 / -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 10px; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font: 400 18px/1 var(--f-display); }
.nights { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.moon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); font: 700 11px/1 var(--f-mono); color: var(--muted); }
.moon.past { background: var(--panel-2); color: var(--fg); }
.moon.now { background: var(--dawn); color: var(--dawn-ink); border-color: var(--dawn); box-shadow: 0 0 14px color-mix(in srgb, var(--dawn) 55%, transparent); }
.phase { display: grid; gap: 2px; min-width: 0; }
.phase-name { font-weight: 800; }
.first { font-size: 12px; color: var(--muted); }
.scores { margin-left: auto; display: flex; gap: 10px; }
.score { display: grid; grid-template-columns: auto auto; align-items: baseline; column-gap: 8px; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.score .who { font-size: 12px; color: var(--muted); grid-row: span 2; align-self: center; }
.score .pts { font: 700 22px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.score.me .pts { color: var(--dawn); }
.score .unit { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

.board { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.side.me { border-color: color-mix(in srgb, var(--dawn) 40%, var(--line)); }
.side-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.side-head h2 { font: 400 17px/1 var(--f-display); }
.side-head small { font: 600 13px var(--f-body); color: var(--muted); margin-left: 6px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; }
.count { font-size: 11px; color: var(--muted); padding: 3px 8px; border-radius: 999px; background: var(--panel-2); display: inline-flex; gap: 5px; align-items: baseline; }
.count b { font: 700 12px var(--f-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.team { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--dawn); color: var(--dawn); }
.side-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1.3fr); gap: 10px; align-items: start; }
.zone { min-width: 0; display: grid; gap: 6px; }
.zone h3, .hand h3 { font: 700 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hand h3 small { font: inherit; letter-spacing: 0; color: var(--fg); margin-left: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.empty { margin: 0; color: var(--muted); font-size: 12px; font-style: italic; padding-block: 8px; }
.opp .side-body { direction: ltr; }

.lieu { border: 1px dashed color-mix(in srgb, var(--fam) 60%, var(--line)); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.lieu-name { font-weight: 800; font-size: 13px; color: var(--fam); margin-bottom: 4px; }
.lieu ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.lieu li { font-size: 11.5px; line-height: 1.3; }
.lieu li.used { opacity: .4; text-decoration: line-through; }
.lieu .when { display: inline-block; font: 700 9px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 5px; }

/* ── Cartes ───────────────────────────────────── */
.card { width: var(--card-w); height: var(--card-h); overflow: hidden; flex: none; border-radius: 8px; padding: 6px 7px; background: linear-gradient(170deg, color-mix(in srgb, var(--fam) 22%, var(--panel-2)), var(--panel-2) 55%); border: 1px solid color-mix(in srgb, var(--fam) 45%, var(--line)); display: flex; flex-direction: column; gap: 3px; position: relative; cursor: default; user-select: none; transition: transform .12s, box-shadow .12s; }
.card.small { --card-w: 78px; --card-h: 92px; }
/* Mots-clés gagnés en jeu (Team, Larbin…) */
.card-kw .kw-add, .bc-kw .kw-add, .kw-add-strip .kw-add { background: var(--good); color: var(--ink); font-weight: 700; }
.kw-add-strip { position: absolute; left: 4px; right: 4px; bottom: 24px; display: flex; flex-wrap: wrap; gap: 2px; pointer-events: none; }
.kw-add-strip .kw-add { font: 700 9px/1.4 var(--f-mono); padding: 0 4px; border-radius: 4px; text-transform: lowercase; }

/* Kick dont la capacité ne s'applique pas : texte barré */
.card.off .card-name, .card.off .card-sub, .card.off .card-kw { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .7; }
.card.off.art::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--bad) calc(50% - 1.5px), var(--bad) calc(50% + 1.5px), transparent calc(50% + 1.5px)); opacity: .85; }
.bc-text.off p:not(.bc-off) { text-decoration: line-through; opacity: .6; }
.bc-off { font: 700 11px var(--f-mono); color: var(--bad); }

/* Illustrations importées : l'image remplace le texte, seuls les états de jeu restent par-dessus */
.card.art { background: var(--panel-2) var(--art) center top / cover no-repeat; padding: 4px; }
.card.art > .card-name, .card.art > .card-sub, .card.art > .card-num, .card.art > .card-kw, .card.art > .card-combo, .card.art .card-top .type, .card.art .card-top .rank { display: none; }
.card.art .card-top { justify-content: flex-start; }
.card.art .badge:not(.mod) { opacity: 0; }
.bc-top { display: grid; gap: 8px; }
.bigcard.has-art .bc-top { grid-template-columns: 104px minmax(0, 1fr); align-items: start; }
.bc-id { display: grid; gap: 6px; min-width: 0; }
.bc-art { width: 100%; border-radius: 8px; aspect-ratio: 63 / 88; object-fit: cover; box-shadow: 0 6px 18px rgb(0 0 0 / .35); }
.bigcard.has-art h3 { font-size: 20px; }
.bc-kw .cls { background: var(--ink); color: var(--fg); font-weight: 700; }
.bt.art { background: var(--panel-2) var(--art) center top / cover no-repeat; }
.bt.art { aspect-ratio: 63 / 88; justify-content: flex-end; }
.bt.art > :not(.bt-count) { display: none; }

.card-top { display: flex; justify-content: space-between; align-items: center; min-height: 22px; }
.badge { min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; display: grid; place-items: center; font: 700 12px/1 var(--f-mono); background: var(--fam); color: var(--ink); font-variant-numeric: tabular-nums; }
.badge.mod { background: var(--dawn); color: var(--dawn-ink); }
.badge.sup { background: transparent; border: 1px solid var(--fam); color: var(--fam); }
.rank { font: 400 16px/1 var(--f-display); color: var(--fam); }
.card-name { font-weight: 800; font-size: 12.5px; line-height: 1.15; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.card-sub { font-size: 10.5px; line-height: 1.2; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.card-kw { flex-wrap: nowrap !important; overflow: hidden; }
.card-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 6px 5px; display: grid; gap: 2px; background: linear-gradient(to bottom, transparent, var(--panel-2) 45%); pointer-events: none; }
.card-foot .card-state, .card-foot .card-hint { margin: 0; }
.card .down-label { position: absolute; left: 7px; bottom: 6px; }
.card-combo { font: 500 10px/1.2 var(--f-mono); color: var(--fam); margin-top: auto; }
.card-combo b { color: var(--fg); }
.card-kw { display: flex; flex-wrap: wrap; gap: 3px; }
.card-kw span { font-size: 9px; line-height: 1; padding: 2px 4px; border-radius: 4px; background: color-mix(in srgb, var(--fam) 18%, transparent); color: var(--fg); }
.card-state { display: flex; flex-wrap: wrap; gap: 3px; }
.card-state span { font: 700 8.5px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px; border-radius: 3px; background: var(--ink); color: var(--dawn); }
.card.down { background: repeating-linear-gradient(135deg, var(--panel) 0 6px, var(--panel-2) 6px 12px); opacity: .7; }
.down-label { font: 700 9px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; margin-top: auto; }
.card.choosable { cursor: pointer; border-color: var(--dawn); box-shadow: 0 0 0 1px var(--dawn), 0 0 16px color-mix(in srgb, var(--dawn) 35%, transparent); }
.card.choosable:hover { transform: translateY(-3px); }
.card.selected { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--dawn); }
.card[data-act] { cursor: pointer; }

/* ── Combat ───────────────────────────────────── */
.combat { background: linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--dawn) 6%, var(--panel))); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; }
.no-combat { color: var(--muted); font-size: 13px; text-align: center; padding-block: 6px; }
.combat-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.stage { font: 700 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--dawn); }
.fight-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 150px; gap: 12px; align-items: center; padding: 6px; border-radius: 8px; }
.fight-row.me { background: color-mix(in srgb, var(--dawn) 7%, transparent); }
.kicks { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.power { display: grid; gap: 3px; justify-items: end; text-align: right; }
.pow { font: 700 38px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.fight-row.me .pow { color: var(--dawn); }
.pow-label, .left { font-size: 11px; color: var(--muted); }
.combo { font: 500 10.5px/1.3 var(--f-mono); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.combo i { font-style: normal; color: var(--fg); margin-left: 3px; }
.combo.on { border-color: var(--good); color: var(--good); }
.combo.blocked { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.mod { font-size: 11px; color: var(--bad); }

/* ── Décision & Main ──────────────────────────── */
.prompt { position: sticky; bottom: max(10px, env(safe-area-inset-bottom, 0px)); z-index: 4; max-height: 52vh; overflow-y: auto; border-radius: var(--r); border: 1px solid var(--dawn); background: color-mix(in srgb, var(--dawn) 9%, var(--panel)); padding: 12px; box-shadow: 0 10px 30px -6px rgba(0,0,0,.6), 0 0 0 6px color-mix(in srgb, var(--ink) 70%, transparent); }
.prompt-body { display: grid; gap: 10px; }
.prompt-title { margin: 0; font-weight: 800; font-size: 16px; }
.prompt-body.waiting { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.prompt-body.waiting p { margin: 0; }
.dots { width: 10px; height: 10px; border-radius: 50%; background: var(--dawn); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.bad { color: var(--bad); }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.hand { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }

/* ── Rail ─────────────────────────────────────── */
.rail { display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); }
.inspector { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 140px; flex: none; max-height: 62vh; overflow-y: auto; }
.insp-empty { margin: 0; color: var(--muted); font-size: 13px; }
.insp { display: grid; gap: 6px; }
.insp h3 { font: 400 20px/1.1 var(--f-display); color: var(--fam); }
.insp p { margin: 0; }
.insp-type { font: 700 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.insp-sub { font-weight: 700; }
.insp-stats { font: 500 12px var(--f-mono); }
.insp-kw { display: flex; flex-wrap: wrap; gap: 4px; }
.insp-kw span { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--fam) 20%, transparent); }
.insp-cond { font-size: 12px; color: var(--dawn); }
.insp-text { font-size: 14px; }
.log-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.log-toggle { all: unset; font: 700 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; cursor: default; }
.log { list-style: none; margin: 0; padding: 0; overflow-y: auto; font-size: 12.5px; line-height: 1.35; display: grid; gap: 3px; max-height: 60vh; }
.log li { padding-left: 8px; border-left: 2px solid transparent; }
.log .l-me { border-color: var(--dawn); }
.log .l-bot { border-color: var(--line); color: var(--muted); }
.log .l-phase { font: 700 10.5px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 0; padding: 4px 0 0; }
.log .l-night { font: 400 13px var(--f-display); color: var(--dawn); border: 0; padding: 6px 0 2px; }

/* ── Fin de partie ────────────────────────────── */
.end { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 78%, transparent); display: grid; place-items: center; z-index: 20; padding: 16px; }
.end-card { background: var(--panel); border: 1px solid var(--dawn); border-radius: 14px; padding: 28px; display: grid; gap: 14px; text-align: center; max-width: 420px; width: 100%; }
.end-card h2 { font: 400 48px/1 var(--f-display); color: var(--dawn); }
.end-score { margin: 0; display: flex; justify-content: center; gap: 24px; font: 700 20px var(--f-mono); }
.end-card .buttons { justify-content: center; }

/* ── Responsive ───────────────────────────────── */
@media (max-width: 1100px) {
  .side-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .side-body .arena { grid-column: 1 / -1; }
}
@media (max-width: 960px) {
  .game { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; }
  .log { max-height: 240px; }
  .log-toggle { cursor: pointer; }
}
@media (max-width: 560px) {
  :root { --card-w: 78px; --card-h: 112px; }
  .card.small { --card-w: 68px; --card-h: 84px; }
  .side-body { grid-template-columns: minmax(0, 1fr); }
  .fight-row { grid-template-columns: auto minmax(0, 1fr); }
  .fight-row .kicks { grid-column: 1 / -1; order: 3; }
  .pow { font-size: 30px; }
  .scores { margin-left: 0; }
  .topbar { gap: 8px 12px; }
}

/* ── Améliorations : ciel, effets, aides ─────────── */
#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: -1; opacity: .8; }
#fx { z-index: 30; }
body { background-attachment: fixed; transition: background-color .8s; }
body.aurore::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(900px 400px at 50% 110%, color-mix(in srgb, var(--dawn) 30%, transparent), transparent 70%); animation: dawn 2.6s ease-out forwards; }
@keyframes dawn { 0% { opacity: 0 } 30% { opacity: 1 } 100% { opacity: 0 } }
body.shake .board { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(5px) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } }
kbd { font: 700 10px/1 var(--f-mono); padding: 2px 4px; border-radius: 4px; border: 1px solid currentColor; opacity: .7; margin-right: 6px; }
.tools { display: flex; gap: 6px; align-items: center; }

.bigcard { border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: linear-gradient(165deg, color-mix(in srgb, var(--fam) 30%, var(--panel-2)), var(--panel-2) 50%, color-mix(in srgb, var(--fam) 12%, var(--panel))); border: 2px solid color-mix(in srgb, var(--fam) 60%, var(--line)); box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px color-mix(in srgb, var(--fam) 35%, transparent); }

}


/* ── Tapis de jeu (écrans ≥ 1100 px) ─────────────── */
.board.mat-mode .side { background: transparent; border: 0; padding: 0; box-shadow: none; display: grid; gap: 8px; }
.board.mat-mode .combat { background: none; border: 0; padding: 0; }
.mat { position: relative; aspect-ratio: 1740 / 1000; container-type: inline-size; border-radius: 1.8cqw; overflow: hidden; box-shadow: 0 18px 40px -18px #000, 0 0 0 1px var(--line); }
.mat-bg { position: absolute; inset: 0; background: url(MAT_DATA_URI) center / 100% 100% no-repeat; }
.mat.flip .mat-bg { transform: rotate(180deg); }
.side.active .mat { box-shadow: 0 18px 40px -18px #000, 0 0 0 2px var(--dawn), 0 0 30px -6px var(--dawn); }
.mz { position: absolute; display: flex; align-items: center; justify-content: center; min-width: 0; }
.mat .card { --card-w: 8.2cqw; --card-h: 11.2cqw; box-shadow: 0 4px 10px -4px #000; }
.mat .card.small { --card-w: 6.8cqw; --card-h: 7.8cqw; }
.mz .row, .mz .kicks { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: .6cqw; width: 100%; height: 100%; }
.mz-kicks .kicks { justify-content: flex-start; }
.mat.flip .mz-kicks .kicks { justify-content: flex-end; }
.mz-fighter.filled .card { box-shadow: 0 0 0 2px var(--dawn), 0 0 22px -2px var(--dawn); }
.mz .stack { display: flex; }
.mz .stack .card + .card { margin-left: -5.5cqw; }
.pile-back { width: 8.2cqw; height: 11.2cqw; border-radius: 8px; display: grid; place-items: center; background: repeating-linear-gradient(45deg, #2b2f60 0 6px, #232752 6px 12px); border: 1px solid var(--line); box-shadow: 3px 3px 0 #1a1d3d, 6px 6px 0 #141632, 0 6px 14px -4px #000; }
.pile-back span { font: 700 clamp(14px, 1.8cqw, 24px) var(--f-mono); background: var(--ink); padding: 4px 10px; border-radius: 999px; }
.pile-btn { position: relative; border: 0; background: transparent; padding: 0; cursor: pointer; width: 100%; height: 100%; display: grid; place-items: center; }
.pile-count { position: absolute; bottom: 6%; right: 8%; font: 700 12px var(--f-mono); background: var(--ink); color: var(--fg); border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; }
.exil-btn { width: 100%; height: 40%; border-radius: 999px; border: 1px solid var(--line); background: var(--ink); color: var(--fg); font: 700 12px var(--f-mono); cursor: pointer; }
.night-die { width: 100%; aspect-ratio: 1; max-height: 100%; display: grid; place-items: center; border-radius: 22%; background: var(--dawn); color: var(--dawn-ink); font: 400 clamp(14px, 1.9cqw, 26px)/1 var(--f-display); box-shadow: 0 3px 8px -2px #000; }
.mat-lieu { width: 100%; height: 100%; border-radius: 8px; padding: .5cqw .7cqw; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid color-mix(in srgb, var(--fam) 60%, var(--line)); display: grid; align-content: start; gap: .3cqw; overflow: hidden; font-size: clamp(9px, .78cqw, 12px); line-height: 1.2; }
.mat-lieu b { color: var(--fam); font-size: 1.15em; }
.mat-lieu span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mat-lieu span i { font: 700 .8em var(--f-mono); font-style: normal; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.mat-lieu span.used { opacity: .35; text-decoration: line-through; }
.mat-lieu span.ready { color: var(--dawn); font-weight: 700; }
.mat-lieu.spent b::after { content: " · utilisé cette nuit"; font: 600 .8em var(--f-body); color: var(--muted); }
.mat-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.mat-head h2 { font: 400 17px/1 var(--f-display); }
.mat-head small { font: 600 13px var(--f-body); color: var(--muted); margin-left: 6px; }
.mat-hand { display: flex; gap: 6px; flex-wrap: wrap; }
.strip { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: 12px; padding: 8px 14px; border-radius: var(--r); background: linear-gradient(90deg, var(--panel), color-mix(in srgb, var(--dawn) 10%, var(--panel)), var(--panel)); border: 1px solid var(--line); }
.strip.live { border-color: color-mix(in srgb, var(--dawn) 50%, var(--line)); }
.strip.idle { grid-template-columns: auto 1fr; color: var(--muted); font-size: 13px; }
.strip-arena { font: 400 14px/1 var(--f-display); color: var(--fg); letter-spacing: .04em; }
.strip-mid { display: grid; gap: 6px; justify-items: center; text-align: center; }
.strip-mid .tug { width: 100%; }
.strip-side { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.strip-side.me { justify-content: flex-end; }
.strip-side .who { font-size: 12px; color: var(--muted); }
.strip-side .pow { font: 700 30px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.strip-side.me .pow { color: var(--dawn); }
.strip-side.winner .pow { text-shadow: 0 0 12px var(--good); }
.strip-side .pips { justify-content: flex-start; }

.forfeit { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.forfeit:hover { background: color-mix(in srgb, var(--bad) 18%, var(--panel)) !important; }
.sup-pile { position: relative; display: inline-block; }
.sup-pile.multi { padding: 0 6px 6px 0; }

.pile-n { position: absolute; z-index: 2; top: -6px; right: -2px; font: 700 11px var(--f-mono); background: var(--dawn); color: var(--dawn-ink); padding: 2px 6px; border-radius: 999px; }
.mz .stack .sup-pile + .sup-pile { margin-left: -4cqw; }

/* ── Familles supplémentaires ─────────────────── */
:root { --foudre: #c4e35a; --felin: #f4a259; --eau: #3fd6c1; --motif: #ff8fc8; --cerebral: #8aa4ff; --son: #e879f9; --sang: #ef5f67; }
.fam-foudre { --fam: var(--foudre); } .fam-felin { --fam: var(--felin); } .fam-eau { --fam: var(--eau); } .fam-motif { --fam: var(--motif); }
.fam-cerebral { --fam: var(--cerebral); } .fam-son { --fam: var(--son); } .fam-sang { --fam: var(--sang); }
.muted { color: var(--muted); font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #2a0606; }
label.btn { display: inline-flex; align-items: center; }
.mini { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; font: 700 14px/1 var(--f-mono); display: inline-grid; place-items: center; padding: 0; }
.mini:hover:not(:disabled) { border-color: var(--dawn); color: var(--dawn); }
.mini:disabled { opacity: .35; cursor: not-allowed; }

/* ── Accueil : mes decks ──────────────────────── */
.mydecks, .match, .artbox { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.md-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.mydecks h2, .match h2, .artbox h2 { font: 400 20px/1 var(--f-display); }
.mydecks h2 small, .artbox h2 small { font: 700 13px var(--f-mono); color: var(--muted); margin-left: 6px; }
.store-note { margin: 0; font-size: 12px; color: var(--muted); }
.mydecks .decks { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
article.deck { cursor: default; background: var(--panel-2); }
.deck-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.deck-top .deck-name { font-size: 22px; overflow-wrap: anywhere; }
.state { font: 700 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.state.ok { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.state.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.deck-err { margin: 0; font-size: 12px; color: var(--bad); }
.deck-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.empty-decks { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 6px; }
.empty-decks h3 { font: 400 18px var(--f-display); }
.empty-decks p { margin: 0; color: var(--muted); max-width: 65ch; }
.match-go { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; }
.match-go .hint { flex: 1 1 260px; }
.btn.big:disabled { opacity: .45; }
.imp-list, .imp-errors { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.imp-errors { color: var(--bad); max-height: 200px; overflow: auto; }
.modal-card h3 { font: 700 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.modal-card textarea { width: 100%; box-sizing: border-box; background: var(--ink); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.45 var(--f-mono); resize: vertical; }
.hint.good { color: var(--good); }

/* ── Éditeur de deck ──────────────────────────── */
.builder { max-width: 1500px; margin: 0 auto; padding-block: 12px 24px; display: grid; gap: 12px; }
.bd-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 10px; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
#bd-name { flex: 1 1 220px; min-width: 0; background: transparent; border: 0; border-bottom: 2px solid var(--line); color: var(--fg); font: 400 24px/1.2 var(--f-display); padding: 4px 2px; }
#bd-name:focus { outline: none; border-color: var(--dawn); }
.bd-status { font-size: 12px; color: var(--muted); }
.bd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.catalog { display: grid; gap: 10px; min-width: 0; }
.cat-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#bd-q { flex: 1 1 240px; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--fg); padding: 8px 14px; font: inherit; }
#bd-q:focus { outline: 2px solid var(--dawn); outline-offset: 1px; }
#bd-kw { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; font: inherit; max-width: 100%; }
.cat-filters .tabs { padding: 0; }
.cat-filters .tab { padding: 6px 12px; font-size: 13px; }
.cat-filters .tab small { font: 700 11px var(--f-mono); color: var(--muted); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.bt { position: relative; border-radius: 10px; padding: 8px 9px 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0;
  background: linear-gradient(170deg, color-mix(in srgb, var(--fam) 20%, var(--panel-2)), var(--panel-2) 60%); border: 1px solid color-mix(in srgb, var(--fam) 40%, var(--line)); transition: transform .12s, box-shadow .12s; }
.bt:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -10px #000, 0 0 0 1px var(--fam); }
.bt.in { box-shadow: 0 0 0 2px var(--dawn); }
.bt.full { cursor: default; }
.bt-num { margin-left: auto; font: 500 9.5px var(--f-mono); color: var(--muted); }
.bt .card-top { gap: 6px; }
.bt-text { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: color-mix(in srgb, var(--fg) 85%, var(--muted)); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.bt .card-kw { margin-top: auto; }
.bt-count { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 4px; padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--fam) 30%, var(--line)); }
.bt-count b { font: 700 15px var(--f-mono); color: var(--dawn); min-width: 1.5ch; text-align: center; }
.deckpanel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.dp-section { display: grid; gap: 6px; }
.dp-section h3 { font: 700 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dp-section h3 small { font: 500 11px var(--f-body); letter-spacing: 0; text-transform: none; color: var(--fg); margin-left: 6px; }
.dp-lieu { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--line); }
.meter { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--muted); transition: width .25s; }
.meter.ok span { background: var(--good); } .meter.bad span { background: var(--bad); }
.dp-ranks { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: var(--muted); }
.dp-ranks span { background: var(--panel-2); border-radius: 999px; padding: 2px 8px; }
.dp-ranks b { color: var(--fg); font-family: var(--f-mono); }
.dp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.dp-row { display: grid; grid-template-columns: 2.4ch minmax(0, 1fr) 2ch 24px 24px; gap: 6px; align-items: center; padding: 3px 4px 3px 8px; border-left: 3px solid var(--fam); border-radius: 4px; background: color-mix(in srgb, var(--fam) 7%, transparent); font-size: 13px; }
.dp-q { font: 700 12px var(--f-mono); color: var(--dawn); }
.dp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-name i { color: var(--muted); font-size: 11.5px; font-style: normal; }
.dp-stat { font: 700 11px var(--f-mono); color: var(--fam); text-align: center; }
.dp-check { border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.dp-check.ok { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); font-weight: 700; }
.dp-check.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.dp-check ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.bd-insp { border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 960px) {
  .bd-grid { grid-template-columns: minmax(0, 1fr); }
  .deckpanel { position: static; max-height: none; order: -1; }
  .bd-insp { display: none; }
}
@media (max-width: 560px) {
  .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .bt-text { -webkit-line-clamp: 3; }
  #bd-name { font-size: 20px; }
}

.card-num { font: 500 8.5px/1 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
.dp-num { font: 500 10px var(--f-mono); color: var(--muted); }
.about { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.about-card .card { cursor: default; }
.about-btns { flex: 1 1 260px; flex-direction: column; align-items: stretch; }
.about-btns .btn { text-align: left; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
